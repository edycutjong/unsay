# Static analysis over the TypeScript. The surface worth it here is small and sharp:
# a hand-rolled HMAC check, a hand-rolled SigV4 signer, a bearer-token verifier and a
# markdown renderer that must never pass a tag through. CodeQL reads all four.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # No build step exists, so there is nothing for autobuild to find: `none` reads
      # the sources as they are, which is also exactly what `npm start` runs.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
