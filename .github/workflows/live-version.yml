# Railway deploys api.unsay.edycu.dev from `main` on every push (connected 2026-09-29).
# Before that it was deployed by hand and drifted from the repository without anything
# noticing — a2a round 1 found exactly that. This asks the deployment which version it
# runs and fails when it is not the version the repository has released, so a failed or
# stalled deploy is caught the same way.
name: live-version

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-version:
    name: the live server runs the released version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: compare /health with package.json
        run: |
          live=$(curl -fsS https://api.unsay.edycu.dev/health | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          want=$(node -p "require('./package.json').version")
          echo "live $live · repository $want"
          test "$live" = "$want" || { echo "live runs $live, the repository is at $want: redeploy"; exit 1; }
