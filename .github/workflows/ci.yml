# The seven commands a judge is told to run, run on every push.
#
# There is no `continue-on-error` anywhere in this file, and there will not be: a
# gate that reports green while a step failed is worse than no gate at all, because
# the badge outlives the memory of why it was allowed to be yellow.
#
# The order is DEMO.md's order — the suite and the type-check first, then the four
# scripts that stand a real HTTP server up and talk to it over Streamable HTTP.
name: ci

on:
  push:
  pull_request:

# A push on top of a push cancels the older run. Nothing here is a deployment, so
# there is nothing to half-finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: suite, types, and the four scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Node 22 is not a preference. `npm start` runs TypeScript through native type
      # stripping with no build step, which is a 22 feature — see FRICTION.md F-009.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

      - name: npm run typecheck
        run: npm run typecheck

      # The reads and writes that MUST fail, do. This is the safety property, and it
      # is the one step whose failure means the product is not the product.
      - name: npm run verify
        run: npm run verify

      - name: npm run e2e
        run: npm run e2e

      - name: npm run probe
        run: npm run probe

      # A correction has to survive the network dropping under it.
      - name: npm run probe:resume
        run: npm run probe:resume

  # The pages, in a real browser. `npm run e2e` above is the protocol as a host
  # speaks it; this is the product as a person clicks it — the landing page's own
  # tokened links, two tabs, a published revision, a struck-through line.
  browser:
    name: the pages, in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: npm run e2e:browser
        run: npm run e2e:browser
      - name: keep the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Accessibility is the hard gate (error below 0.9). Performance, best practices
  # and SEO warn — they are reported, and a warning does not turn the run green
  # while hiding a failure, because it was never a failure.
  lighthouse:
    name: lighthouse (accessibility gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: npm run lighthouse
        run: npm run lighthouse
