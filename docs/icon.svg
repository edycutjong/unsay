<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="Unsay">
  <title>Unsay</title>
  <rect width="144" height="144" rx="32" fill="#0B0D0E"/>
  <!-- the retracted line: struck through, in the amber this project uses to mean
       "this changed". The dot is the notification that struck it. -->
  <g stroke-linecap="round">
    <line x1="30" y1="56" x2="98" y2="56" stroke="#4A5155" stroke-width="9"/>
    <line x1="30" y1="56" x2="106" y2="56" stroke="#F2A93B" stroke-width="4"/>
  </g>
  <line x1="30" y1="88" x2="88" y2="88" stroke="#F2F4F5" stroke-width="9" stroke-linecap="round"/>
  <circle cx="108" cy="88" r="9" fill="#F2A93B"/>
</svg>
