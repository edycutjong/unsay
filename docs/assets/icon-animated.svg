<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Unsay — retracts what Alexa just said. The spoken instruction is struck through in amber the instant the update frame lands; the new line stands white beneath."><title>Unsay</title><defs><linearGradient id="strike" gradientUnits="userSpaceOnUse" x1="88" y1="0" x2="398" y2="0"><stop offset="0" stop-color="#F2A93B"/><stop offset="1" stop-color="#FFC15E"/></linearGradient><filter id="breath" x="-30%" y="-120%" width="160%" height="340%"><feGaussianBlur stdDeviation="14"/></filter><style>@keyframes stop-pop {
        0%, 10%   { transform: scale(1); }
        15%, 22%  { transform: scale(0); }
        26.5%     { transform: scale(1.28); }
        30%, 100% { transform: scale(1); }
      }
      .stop { transform-box: fill-box; transform-origin: center; animation: stop-pop 6s cubic-bezier(.2,1.4,.4,1) infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style></defs><rect x="0" y="0" width="512" height="512" rx="116" fill="#0B0D0E"/><rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/><g filter="url(#breath)" opacity="0.5"><animate attributeName="opacity" values="0.5;0.5;0;0;0.85;0.4;0.8;0.5" keyTimes="0;.10;.14;.44;.56;.72;.86;1" dur="6s" repeatCount="indefinite"/><line x1="88" y1="197" x2="378" y2="197" stroke="#F2A93B" stroke-width="22" stroke-linecap="round"/><circle cx="398" cy="197" r="32" fill="#F2A93B"/></g><line x1="110" y1="197" x2="336" y2="197" stroke="#636C72" stroke-width="46" stroke-linecap="round"><animate attributeName="stroke" values="#636C72;#636C72;#F2F4F5;#F2F4F5;#636C72;#636C72" keyTimes="0;.10;.18;.40;.48;1" dur="6s" repeatCount="indefinite"/></line><path d="M378 197 L88 197" pathLength="100" stroke="url(#strike)" stroke-width="20" stroke-linecap="round" fill="none" stroke-dasharray="100" stroke-dashoffset="0"><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.10;.15;.33;.34;1" dur="6s" repeatCount="indefinite"/><animate attributeName="stroke-dashoffset" values="0;0;100;100;0;0" keyTimes="0;.15;.16;.34;.44;1" dur="6s" repeatCount="indefinite"/></path><circle class="stop" cx="398" cy="197" r="30" fill="#F2A93B"/><path d="M110 315 L284 315" pathLength="100" stroke="#F2F4F5" stroke-width="46" stroke-linecap="round" fill="none" stroke-dasharray="100" stroke-dashoffset="0"><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.10;.15;.455;.46;1" dur="6s" repeatCount="indefinite"/><animate attributeName="stroke-dashoffset" values="0;0;100;100;0;0" keyTimes="0;.15;.16;.46;.56;1" dur="6s" repeatCount="indefinite"/></path></svg>