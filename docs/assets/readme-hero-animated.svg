    </g>
  </g>
  <!-- shimmer: a skewed highlight sweeping under the clip of the "un" glyphs -->
  <g clip-path="url(#un-clip)">
    <rect x="60" y="20" width="44" height="100" fill="url(#shine)" transform="skewX(-22)">
      <animate attributeName="x" values="60;60;300;300" keyTimes="0;.56;.70;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text class="sans" x="48" y="134" font-size="16.5" fill="#C3CACF">The assistant that can be corrected — mid-sentence.</text>
  <text class="mono metric" x="48" y="170" font-size="12.5" fill="#F2A93B">200/200 retractions landed inside the speech window · loopback</text>
  <text class="mono" x="48" y="196" font-size="11.5" fill="#7C858B">MCP 2025-11-25 · Streamable HTTP · Alexa+ · TypeScript · Node 22</text>
  <text class="mono" x="48" y="292" font-size="10.5" fill="#7C858B">Illustration of the mechanism · figures in docs/proof/bench.txt</text>

  <!-- ═══ right: the product story — Ray's device card ═══ -->
  <rect x="592" y="24" width="648" height="272" rx="16" fill="#121517" stroke="#ffffff" stroke-opacity="0.09"/>

  <!-- steady layer of the panel -->
  <text class="mono" x="618" y="56" font-size="11" letter-spacing="2.4" fill="#7C858B">WEIGHT BEARING</text>
  <circle class="live-dot" cx="1112" cy="52" r="4" fill="#3F9E63"/>
  <text class="mono" x="1122" y="56" font-size="10.5" letter-spacing="1.4" fill="#5CB77E">LIVE · SUBSCRIBED</text>
  <text class="sans" x="618" y="92" font-size="15" fill="#9BA3A8">“Can I put weight on it yet?”</text>

  <!-- the spoken line: white while it is being spoken, dimmed when struck. textLength pins its width so the strike fits on every OS font. -->
  <text class="sans" x="618" y="140" font-size="23" font-weight="600" fill="#6E777C" textLength="520" lengthAdjust="spacingAndGlyphs">You can put about half your weight on it—<animate attributeName="fill" values="#6E777C;#6E777C;#F2F4F5;#F2F4F5;#6E777C;#6E777C" keyTimes="0;.12;.18;.34;.40;1" dur="8s" repeatCount="indefinite"/></text>
  <rect class="caret" data-story="beat-2" x="1142" y="121" width="3" height="23" rx="1" fill="#F2F4F5" opacity="0"/>

  <line x1="618" y1="262" x2="1214" y2="262" stroke="#ffffff" stroke-opacity="0.16" stroke-dasharray="3 5"/>
  <text class="mono" x="618" y="283" font-size="10.5" fill="#7C858B">care-internal://ray/risk · fall risk HIGH</text>
  <text class="mono" x="1214" y="283" font-size="10.5" letter-spacing="1.4" fill="#D9564A" text-anchor="end">NEVER SPOKEN</text>

  <!-- persistent residue — visible at t=0 (the poster carries the verb), crossfades out 12-17% for the replay, returns at the beat, and is still there at the seam -->
  <path d="M606 132 L1150 132" pathLength="100" stroke="url(#strike-t)" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="100" stroke-dashoffset="0">
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.12;.17;.295;.30;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0;0;100;100;0;0" keyTimes="0;.17;.18;.30;.38;1" dur="8s" repeatCount="indefinite"/>
  </path>
  <circle class="pop-stop" cx="1158" cy="132" r="5" fill="#F2A93B">
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.12;.17;.375;.38;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text class="sans pop-wait" x="618" y="180" font-size="27" font-weight="700" fill="#F2F4F5">Wait — don’t do that.<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.12;.17;.38;.43;1" dur="8s" repeatCount="indefinite"/></text>
  <text class="sans pop-new" x="618" y="212" font-size="21" font-weight="500" fill="#E6E9EB">Full weight-bearing as tolerated.<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.12;.17;.42;.47;1" dur="8s" repeatCount="indefinite"/></text>
  <circle class="pop-dot" cx="623" cy="241" r="5.5" fill="#F2A93B">
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.12;.17;.48;.50;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text class="mono" x="637" y="246" font-size="12" fill="#F2A93B">changed just now<tspan fill="#9BA3A8"> · Sarah Okafor, physio</tspan><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.12;.17;.50;.54;1" dur="8s" repeatCount="indefinite"/></text>

  <!-- story-only layer: hidden at t=0, fades out 95-98.5% so the seam pair equals the poster -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.95;.985;1" dur="8s" repeatCount="indefinite"/>

    <!-- beat 2 · the update frame arrives -->
